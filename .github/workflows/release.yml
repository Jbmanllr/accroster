# The release: on a `vX.Y.Z` tag, check the tag against Cargo.toml, run CI's
# gate, then build, sign, notarize and check the dmg with scripts/release.sh
# and publish it with its checksum as a GitHub Release (docs/RELEASING.md).
#
# The secrets live in the `release` environment, which only tags matching `v*`
# can use, and only the release job names it: the gate runs without them, and
# a required reviewer approves after the gate has passed. Every step that can
# fail runs before the publish step, so a failed signature, notarization,
# staple or Gatekeeper check publishes nothing.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# One release per tag at a time; a run in progress is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # Cheapest first: a tag that names the wrong version fails here, before
      # anything is built.
      - name: Tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::version mismatch: tag $GITHUB_REF_NAME but Cargo.toml says $version; bump workspace.package.version or fix the tag"
            exit 1
          fi
      # Same gate and toolchain as CI's check job.
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Reads main's cache; a tag never writes one.
          save-if: false
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  release:
    needs: check
    runs-on: macos-latest
    # Notarization waits on Apple, twice (the app, then the dmg).
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Where the keychain and keys go: the runner's temp folder, which the
      # cleanup step empties of them.
      - name: Secret file paths
        run: |
          {
            echo "KEYCHAIN=$RUNNER_TEMP/release.keychain-db"
            echo "P12=$RUNNER_TEMP/developer-id.p12"
            echo "NOTARY_KEY_P8=$RUNNER_TEMP/notary-key.p8"
          } >> "$GITHUB_ENV"
      # The runner's rustup installs rust-toolchain.toml's toolchain with
      # both Mac targets.
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Icon tool
        run: brew install librsvg
      # A temporary keychain on the user search list, where the script looks
      # for the identity; the partition list lets codesign use the key without
      # a prompt.
      - name: Import the Developer ID certificate
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$P12"
          security import "$P12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # Keep the existing keychains; their paths hold no spaces.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      - name: Decode the notary key
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_P8"
      # Signs, notarizes and staples the app and the dmg, then checks them with
      # codesign, lipo, spctl and stapler; any failure exits non-zero.
      - name: Build, sign and notarize
        env:
          DEVELOPER_ID_NAME: ${{ vars.DEVELOPER_ID_NAME }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/release.sh --developer-id --version "$GITHUB_REF_NAME"
      # Run from target/dist so the file names the dmg alone and
      # `shasum -a 256 -c` works next to the download.
      - name: Checksum
        working-directory: target/dist
        run: |
          dmg="AccRoster-${GITHUB_REF_NAME#v}.dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          cat "$dmg.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="target/dist/AccRoster-${GITHUB_REF_NAME#v}.dmg"
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            "$dmg" "$dmg.sha256"
      - name: Delete the keychain and keys
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2> /dev/null || true
          rm -f "$P12" "$NOTARY_KEY_P8"
