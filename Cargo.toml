[workspace]
members = [".", "core", "fake-mac"]
default-members = [".", "core", "fake-mac"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
authors = ["Jean-Baptiste Manillier"]
repository = "https://github.com/Jbmanllr/accroster"
publish = false

[workspace.dependencies]
accroster-core = { path = "core" }
accroster-fake-mac = { path = "fake-mac" }
jiff = { version = "0.2.38", features = ["serde"] }
libc = "0.2.191"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"

# The app binary: the thin AppKit UI layer. All behaviour lives in `accroster-core`.
[package]
name = "accroster"
description = "A menu bar app for Claude Code accounts: limits, sessions and one-click switching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
accroster-core.workspace = true
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "SMAppService"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
